<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Who Is The Pigeon?</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
body{margin:0;background:#111;color:#fff;font:16px system-ui;overflow:hidden;height:100dvh}
.scr{position:fixed;inset:0;display:none;flex-direction:column;padding:16px;gap:10px;overflow:auto;background:#1b1f2a;z-index:5}.scr.on{display:flex}
button,input{font:inherit;padding:14px;border-radius:12px;border:0;background:#3a7bd5;color:#fff}input{background:#fff;color:#000;user-select:text}
button:disabled{opacity:.4}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}h1{text-align:center;margin:20px 0}
#cv{position:fixed;inset:0;touch-action:none}
#joy{position:fixed;left:20px;bottom:max(24px,env(safe-area-inset-bottom));width:140px;height:140px;border-radius:50%;background:#fff3;touch-action:none}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:#fffc}
#btns{position:fixed;right:16px;bottom:max(24px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#btns button{width:96px;height:64px;font-weight:700;display:none}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));right:8px;display:flex;gap:8px}#top button{padding:10px 14px;background:#000a}
#q{position:fixed;top:60px;left:10px;right:10px;background:#000d;padding:12px;border-radius:12px;display:none;z-index:3}
#hud{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;background:#000a;padding:8px 12px;border-radius:10px}
.pl{background:#2a3040;padding:10px;border-radius:10px}#chat{flex:1;min-height:120px;overflow:auto;background:#10131a;border-radius:10px;padding:8px;user-select:text}.d{color:#999}
#toast{position:fixed;top:30%;left:10%;right:10%;text-align:center;background:#000d;padding:16px;border-radius:12px;z-index:9;display:none}
</style></head><body>
<canvas id=cv></canvas>
<div id=hud></div><div id=top><button id=bq>📋</button><button id=bm>🗺️</button><button id=bs>⚙️</button></div><div id=q></div>
<div id=joy><div id=knob></div></div>
<div id=btns><button id=use style="background:#2e9c5a">USE</button><button id=kill style="background:#c0392b">KILL</button><button id=eat style="background:#d68910">EAT</button><button id=shoot style="background:#7d3c98">SHOOT</button><button id=rev style="background:#16a085">REVIVE</button><button id=rep style="background:#e67e22">REPORT</button></div>
<div id=toast></div>
<div class="scr on" id=menu><h1>🐦 WHO IS THE PIGEON?</h1><input id=nm placeholder="Your name" maxlength=12><button id=cr>Create Room</button><input id=cd placeholder="Room code" maxlength=6 style="text-transform:uppercase"><button id=jn>Join Room</button></div>
<div class=scr id=lob><h1 id=lc></h1><div id=lp></div><div id=lcfg></div><button id=go>Start Game</button><small id=lh></small></div>
<div class=scr id=rr style="justify-content:center;align-items:center;text-align:center"><div style="font-size:90px" id=ri></div><h1 id=rn></h1><p id=rt></p></div>
<div class=scr id=mt><div class=row><b>🏛️ Meeting</b><b id=mtm></b></div><div id=mpl></div><div id=chat></div><div class=row><input id=ci style="flex:1" maxlength=120><button id=cs>Send</button></div></div>
<div class=scr id=ov><h1 id=ow></h1><div id=orv></div><button id=oa>Play Again</button><button id=ol>Return to Lobby</button></div>
<script>
const $=i=>document.getElementById(i),RI={pigeon:['🐦','PIGEON','Evil Team: kill players without being seen. Don\'t get voted out.'],eater:['🍴','BIG EATER','Neutral: eat players silently (no body). Be one of the last two.'],gunman:['🔫','GUNMAN','Good: one shot. Shooting a Good player kills you too.'],seller:['🍜','PORRIDGE SELLER','Good: revive one body you find. Eaten players leave no body.'],normal:['🙂','NORMAL PERSON','Good: finish quests, watch, discuss, vote.']};
const EM={pigeon:'🐦',eater:'🍴',gunman:'🔫',seller:'🍜',normal:'🙂'};
let ws,S=null,M=null,L=null,scr='menu',P={},mapOn=false,sig='',host=null;
const send=o=>ws&&ws.readyState==1&&ws.send(JSON.stringify(o));
function show(s){scr=s;document.querySelectorAll('.scr').forEach(e=>e.classList.remove('on'));const e={menu:'menu',lob:'lob',rr:'rr',mt:'mt',ov:'ov'}[s];if(e)$(e).classList.add('on')}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3500)}
function conn(f){ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);ws.onopen=f;ws.onmessage=e=>on(JSON.parse(e.data));ws.onclose=()=>{toast('Disconnected');setTimeout(()=>location.reload(),2500)}}
$('cr').onclick=()=>conn(()=>send({t:'create',name:$('nm').value}));
$('jn').onclick=()=>conn(()=>send({t:'join',name:$('nm').value,code:$('cd').value}));
function on(m){if(m.t=='err')return toast(m.m);
if(m.t=='L'){L=m;host=m.host==m.me;show('lob');$('lc').textContent='Room '+m.code+'  '+m.n+'/15';
$('lp').innerHTML=m.players.map(p=>`<div class=pl>${p.id==m.host?'👑 ':''}${esc(p.name)}</div>`).join('');
const tot=Object.values(m.cfg).reduce((a,b)=>a+b,0);
$('lcfg').innerHTML=Object.keys(m.cfg).map(k=>`<div class=row><span>${EM[k]} ${k}</span><span>${host?`<button onclick="cfg('${k}',-1)">−</button> `:''}<b>${m.cfg[k]}</b>${host?` <button onclick="cfg('${k}',1)">+</button>`:''}</span></div>`).join('')+`<div class=row><b>Total roles ${tot}/${m.n}</b></div>`;
$('go').style.display=host?'':'none';$('go').disabled=tot!=m.n||m.n<6;$('lh').textContent=host?'Need 6–15 players; roles must equal player count.':'Waiting for host…'}
if(m.t=='start'){M=m.map;P={};const r=RI[m.role];$('ri').textContent=r[0];$('rn').textContent=r[1];$('rt').textContent=r[2];show('rr');setTimeout(()=>{if(scr=='rr')show('game')},4000)}
if(m.t=='S'){S=m;if(scr=='rr'||scr=='ov')return;if(m.st=='meeting'){show('mt');meetUI()}else if(scr!='game')show('game')}
if(m.t=='C'){const d=document.createElement('div');d.className=m.dead?'d':'';d.textContent=(m.dead?'👻 ':'')+m.from+': '+m.m;$('chat').append(d);$('chat').scrollTop=1e9}
if(m.t=='R'){toast(m.m);show('game');sig=''}
if(m.t=='O'){host=m.host==m.me;S=null;show('ov');$('ow').textContent={'Pigeon Team':'🐦 PIGEON WINS!','Big Eater':'🍴 BIG EATER WINS!','Good Team':'🙂 GOOD TEAM WINS!'}[m.winner];
$('orv').innerHTML=m.reveal.map(p=>`<div class=pl>${EM[p.role]} <b>${esc(p.name)}</b> — ${p.role} (${p.team}) ${p.alive?'✅ Alive':'💀 Dead'}</div>`).join('');$('oa').disabled=$('ol').disabled=!host}}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
window.cfg=(k,v)=>{const c={...L.cfg};c[k]=Math.max(0,c[k]+v);send({t:'cfg',cfg:c})};
$('go').onclick=()=>send({t:'start'});$('oa').onclick=()=>send({t:'again'});$('ol').onclick=()=>send({t:'lobby'});
function meetUI(){const me=S.me,s=JSON.stringify([S.pl.map(p=>[p.id,p.v]),me.vote,me.alive]);$('mtm').textContent=S.left+'s';if(s==sig)return;sig=s;
$('mpl').innerHTML=S.pl.map(p=>`<div class="row pl"><span>${esc(p.name)} ${p.v?'✔':''}</span>${me.alive&&!me.vote?`<button onclick="vote('${p.id}')">Vote</button>`:''}</div>`).join('')+(me.alive&&!me.vote?`<button onclick="vote('skip')" style="width:100%;background:#555">Skip Vote</button>`:'')+(me.vote?'<small>Vote cast.</small>':'')+(me.alive?'':'<small>👻 You are dead: you can only chat with other spectators.</small>')}
window.vote=id=>send({t:'vote',id});
$('cs').onclick=()=>{if($('ci').value){send({t:'chat',m:$('ci').value});$('ci').value=''}};
const act=(b,t)=>$(b).onclick=()=>send({t});act('kill','kill');act('eat','eat');act('shoot','shoot');act('rep','report');act('rev','revive');
$('use').onclick=()=>{const m=S.me;if(m.q.some(q=>!q.d&&dist(q,P[m.id])<70))send({t:'task'});else send({t:'emergency'})};
$('bq').onclick=()=>{const q=$('q');q.style.display=q.style.display=='block'?'none':'block'};
$('bm').onclick=()=>mapOn=!mapOn;$('bs').onclick=()=>{if(confirm('Leave game?'))location.reload()};
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
// joystick
let mv={dx:0,dy:0},keys={};const joy=$('joy'),kn=$('knob');
function jm(e){const r=joy.getBoundingClientRect(),t=e.touches?e.touches[0]:e;let x=(t.clientX-r.left-70)/60,y=(t.clientY-r.top-70)/60,l=Math.hypot(x,y);if(l>1){x/=l;y/=l}mv={dx:x,dy:y};kn.style.left=45+x*45+'px';kn.style.top=45+y*45+'px';e.preventDefault()}
const jend=()=>{mv={dx:0,dy:0};kn.style.left=kn.style.top='45px'};
joy.addEventListener('touchstart',jm,{passive:false});joy.addEventListener('touchmove',jm,{passive:false});joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
onkeydown=e=>keys[e.key.toLowerCase()]=1;onkeyup=e=>keys[e.key.toLowerCase()]=0;
setInterval(()=>{if(scr!='game')return;let dx=mv.dx,dy=mv.dy;if(keys.a||keys.arrowleft)dx=-1;if(keys.d||keys.arrowright)dx=1;if(keys.w||keys.arrowup)dy=-1;if(keys.s||keys.arrowdown)dy=1;send({t:'mv',dx,dy})},80);
// render
const cv=$('cv'),g=cv.getContext('2d'),hue=s=>[...s].reduce((a,c)=>a+c.charCodeAt(0)*37,0)%360;
function frame(){requestAnimationFrame(frame);const W=cv.width=innerWidth,H=cv.height=innerHeight;if(scr!='game'||!S||!M)return;const me=S.me;
for(const p of S.pl){const o=P[p.id]||(P[p.id]={x:p.x,y:p.y});o.x+=(p.x-o.x)*.4;o.y+=(p.y-o.y)*.4;o.name=p.name}
const t=P[me.id]&&me.alive?P[me.id]:(S.pl[0]&&P[S.pl[0].id])||{x:400,y:700},sc=mapOn?Math.min(W/800,H/1400):W/440;
g.fillStyle='#6f9f6a';g.fillRect(0,0,W,H);g.setTransform(sc,0,0,sc,W/2-(mapOn?400:t.x)*sc,H/2-(mapOn?700:t.y)*sc);
g.fillStyle='#7aa874';g.fillRect(0,0,800,1400);g.strokeStyle='#d8c9a0';g.lineWidth=28;g.lineJoin='round';
for(const p of M.PATHS){g.beginPath();p.forEach((c,i)=>i?g.lineTo(...c):g.moveTo(...c));g.stroke()}
g.textAlign='center';for(const a of M.AREAS){g.fillStyle=a.c;g.fillRect(a.x,a.y,a.w,a.h);g.strokeStyle='#0005';g.lineWidth=4;g.strokeRect(a.x,a.y,a.w,a.h);g.fillStyle='#000a';g.font='bold 18px system-ui';g.fillText(a.n,a.x+a.w/2,a.y+22)}
const D=M.DOME;g.fillStyle='#8e7cc3';g.beginPath();g.arc(D.x,D.y,D.r,0,7);g.fill();g.fillStyle='#fff';g.fillText('🏛️ DOME',D.x,D.y+6);
g.font='22px system-ui';for(const q of me.q)if(!q.d){g.fillText('❗',q.x,q.y+8)}
for(const b of S.bodies)g.fillText('💀',b.x,b.y+8);
for(const p of S.pl){const o=P[p.id];g.fillStyle=`hsl(${hue(p.id)},70%,55%)`;g.beginPath();g.arc(o.x,o.y,13,0,7);g.fill();if(p.id==me.id){g.strokeStyle='#fff';g.lineWidth=3;g.stroke()}
g.fillStyle='#fff';g.font='bold 12px system-ui';g.fillText(o.name,o.x,o.y-19)}
// ui
const mp=P[me.id],al=me.alive&&mp;let nb=null,nd=999;if(al)for(const p of S.pl)if(p.id!=me.id){const x=dist(P[p.id],mp);if(x<nd){nd=x;nb=p}}
const sh=(b,v,txt)=>{$(b).style.display=v?'block':'none';if(txt)$(b).textContent=txt};
const body=al&&S.bodies.some(b=>dist(b,mp)<90),qn=al&&me.q.some(q=>!q.d&&dist(q,mp)<70),dm=al&&!me.em&&dist(D,mp)<D.r+40;
sh('kill',al&&me.role=='pigeon'&&nd<70,me.k?'KILL '+me.k:'KILL');sh('eat',al&&me.role=='eater'&&nd<70,me.k?'EAT '+me.k:'EAT');
sh('shoot',al&&me.role=='gunman'&&!me.shot&&nd<200);sh('rev',al&&me.role=='seller'&&!me.rev&&body);sh('rep',body);sh('use',qn||dm,qn?'TASK':'MEETING');
const done=me.q.filter(q=>q.d).length;$('hud').textContent=`${EM[me.role]} ${me.alive?'':'💀 '}${S.pl.length} alive`+(me.alive?'':' · spectating');
$('q').innerHTML='<b>Quests</b><br>'+me.q.map(q=>(q.d?'✅ ':'⬜ ')+q.n).join('<br>')+`<br><small>${done}/${me.q.length}</small>`}
requestAnimationFrame(frame);
$('ci').addEventListener('keydown',e=>{if(e.key=='Enter')$('cs').click()});
setInterval(()=>{if(scr=='game')sig=''},1000);
</script></body></html>
